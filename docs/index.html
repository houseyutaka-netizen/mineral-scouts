<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#26352d">
<title>Mineral Scout</title>
<style>
:root{color-scheme:light;--green:#26352d;--paper:#f6f5f0;--line:#deded5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#292d29;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:var(--green);color:white;padding:26px 20px}header h1{margin:0;font-family:Georgia,serif;font-size:28px}header p{margin:8px 0 0;color:#d5ddd5;font-size:13px}
main{max-width:1000px;margin:auto;padding:20px 16px 48px}.toolbar{display:flex;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;min-width:0}input{flex:1;width:50%}button{cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#627464}label select{width:100%;color:#292d29}
#status,.note{font-size:12px;color:#686d67;line-height:1.7}#warning{color:#8d5419;font-size:12px;line-height:1.7}
#items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.item{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.thumbnail{display:block;background:#eee;aspect-ratio:1}.thumbnail img{display:block;width:100%;height:100%;object-fit:contain}.details{padding:14px}.site{font-size:12px;color:#627464;margin-bottom:8px}
.badge{display:inline-block;font-size:11px;border-radius:5px;padding:4px 7px;margin-bottom:10px}.available{background:#e5f2e8;color:#285f37}.sold_out{background:#f4e5e5;color:#934343}.unknown{background:#f4eedf;color:#7b642f}
.item h2{font-size:15px;line-height:1.6;margin:0 0 12px;overflow-wrap:anywhere}.item a{color:var(--green);font-weight:600;text-decoration:none}.product-link{font-size:13px}
.price{font-size:21px;font-weight:700;line-height:1.5;margin:0 0 5px;color:var(--green);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.price.unconfirmed{font-size:14px;color:#777;font-weight:400}.price-note{font-size:11px;color:#777;line-height:1.6;margin:0 0 14px}
.empty{grid-column:1/-1;padding:32px 16px;text-align:center;color:#747970;background:white;border:1px dashed var(--line);border-radius:12px;line-height:1.8}footer{text-align:center;color:#858980;font-size:11px;padding:24px}
@media(max-width:700px){#items{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){#items{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;font-weight:600}.tabs button[aria-pressed="true"]{background:var(--green);color:white;border-color:var(--green)}
.auction-meta{font-size:12px;line-height:1.8;color:#626b62;margin:6px 0 14px}.price-label{font-size:11px;font-weight:400;display:block;color:#686d67}.listed{background:#e5edf2;color:#36596f}.elapsed{background:#eee;color:#666}.upcoming{background:#f1ecfa;color:#72548d}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b89845;outline-offset:2px}
.thumbnail{position:relative}.thumbnail.no-image{display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.end-overlay{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:rgba(25,38,30,.9);color:#fff;font-size:12px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.end-overlay.elapsed{background:rgba(70,70,70,.92);color:#fff}
</style>
</head>
<body>
<header><h1>Mineral Scout</h1><p>鉱物標本の新着を見つける</p></header>
<main>
<nav class="tabs" aria-label="商品区分"><button id="retail-tab" type="button" aria-pressed="true">通常販売</button><button id="auction-tab" type="button" aria-pressed="false">オークション</button></nav>
<div class="toolbar"><input id="search" type="search" aria-label="標本名・販売店で検索" placeholder="標本名・販売店で検索"><button id="refresh">更新</button></div>
<div class="filters">
<label><span id="filter-label">販売状況</span><select id="availability"><option value="available">販売中</option><option value="sold_out">SOLD OUT</option><option value="all">すべて</option><option value="unknown">状況未確認</option></select></label>
<label>販売店<select id="shop"><option value="">すべての販売店</option></select></label>
<label>表示順<select id="sort"><option value="source">新しく取得した順</option><option value="site">販売店順</option><option value="ending" id="ending-option" hidden>終了予定が近い順</option></select></label>
</div>
<p class="note" id="retail-note">価格は販売元の表示通貨のまま掲載しています。送料・税・最新の在庫は販売ページでご確認ください。AMFの価格は順次取得します。</p>
<p class="note" id="auction-note" hidden>価格・入札数・開催状況は巡回時点の情報です。「更新」は保存済みデータの再読み込みです。終了時刻は日本時間（JST）で表示します。終了延長や最新の入札額は出品ページで確認してください。e-RocksはHot Auction itemsのみです。</p>
<p id="status" aria-live="polite">読み込み中...</p><p id="warning" role="status"></p><section id="items"></section>
</main>
<footer>Mineral Scout · 画像・販売情報は各販売元で確認してください</footer>
<script>
let allItems=[], updated='未更新', errors=[], activeTab='retail', loaded=false;
const auctionLabels={listed:'一覧に掲載',upcoming:'開始前',elapsed:'終了予定を経過',unknown:'状況未確認'};
function isAuction(item){return item.listing_type==='auction';}
function inTab(item){return isAuction(item)===(activeTab==='auction');}
function stateOf(item){
 if(item.stale)return 'unknown';
 if(!isAuction(item))return availabilityOf(item);
 const end=Date.parse(item.ends_at);
 if(Number.isFinite(end)&&end<=Date.now())return 'elapsed';
 return ['listed','upcoming'].includes(item.auction_status)?item.auction_status:'unknown';
}
function dateJST(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST';}
function switchTab(tab){
 activeTab=tab;const auction=tab==='auction';
 document.getElementById('retail-tab').setAttribute('aria-pressed',String(!auction));
 document.getElementById('auction-tab').setAttribute('aria-pressed',String(auction));
 document.getElementById('filter-label').textContent=auction?'掲載状況':'販売状況';
 const select=document.getElementById('availability');select.replaceChildren();
 const options=auction?[['all','すべて'],...Object.entries(auctionLabels)]:[['available','販売中'],['sold_out','SOLD OUT'],['all','すべて'],['unknown','状況未確認']];
 options.forEach(([v,t])=>select.add(new Option(t,v)));
 document.getElementById('sort').value='source';document.getElementById('ending-option').hidden=!auction;
 document.getElementById('retail-note').hidden=auction;document.getElementById('auction-note').hidden=!auction;
 document.getElementById('shop').value='';updateShops();if(loaded)render();
}

const labels={available:'販売中',sold_out:'SOLD OUT',unknown:'状況未確認'};
function availabilityOf(item){return Object.hasOwn(labels,item.availability)?item.availability:'unknown';}
function safeUrl(value){if(!value)return '';try{const url=new URL(value,location.href);return ['https:','http:'].includes(url.protocol)?url.href:'';}catch{return '';}}
function makeLink(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function showEmpty(message){const box=document.createElement('div');box.className='empty';box.textContent=message;document.getElementById('items').replaceChildren(box);}
function updateShops(){const el=document.getElementById('shop'),previous=el.value;const shops=[...new Set(allItems.filter(inTab).map(i=>i.site).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));el.replaceChildren(new Option('すべての販売店',''));shops.forEach(s=>el.add(new Option(s,s)));el.value=shops.includes(previous)?previous:'';}
async function loadItems(){
 const status=document.getElementById('status'),button=document.getElementById('refresh');button.disabled=true;status.textContent='データを読み込み中...';
 try{
  const response=await fetch('./data/latest.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('取得失敗');const data=await response.json();
  allItems=Array.isArray(data.items)?data.items:[];errors=Array.isArray(data.errors)?data.errors:[];updated=dateJST(data.updated)||'未更新';loaded=true;updateShops();render();
 }catch{loaded=false;status.textContent='データを読み込めませんでした。';document.getElementById('warning').textContent='';showEmpty('時間を置いて「更新」を押してください。');}
 finally{button.disabled=false;}
}
function appendPrice(details,item){
 const price=document.createElement('p');price.className='price';
 const hasPrice=typeof item.price_text==='string'&&item.price_text.trim();
 if(item.price_status==='inquiry'){price.textContent='価格要問い合わせ';}
 else if(hasPrice){price.textContent=item.price_text;}
 else{price.textContent='価格未確認';price.classList.add('unconfirmed');}
 if(isAuction(item)){const label=document.createElement('span');label.className='price-label';label.textContent=({current_bid:'現在入札額（取得時点）',starting:'開始価格',listed:'掲載価格（取得時点）'})[item.price_kind]||'掲載価格';price.prepend(label);}
 details.appendChild(price);
 const notes=[];
 if(item.availability==='sold_out'&&hasPrice)notes.push('売り切れ商品の掲載価格');
 if(item.price_cached||item.stale)notes.push('過去の取得価格');
 if(hasPrice||item.price_status==='inquiry'){
  const date=new Date(item.price_checked_at);
  if(!Number.isNaN(date.getTime()))notes.push('価格確認 '+dateJST(item.price_checked_at));
 }
 if(notes.length){const note=document.createElement('p');note.className='price-note';note.textContent=notes.join(' · ');details.appendChild(note);}
}
function render(){
 const query=document.getElementById('search').value.trim().toLowerCase(),shop=document.getElementById('shop').value,selected=document.getElementById('availability').value;
 const tabItems=allItems.filter(inTab);
 const matching=tabItems.filter(i=>(!shop||i.site===shop)&&`${i.title||''} ${i.site||''}`.toLowerCase().includes(query));
 const filtered=matching.filter(i=>selected==='all'||stateOf(i)===selected);
 const sort=document.getElementById('sort').value;
 // 同時取得は商品名順。販売店順を暗黙の優先条件にしない。
 filtered.sort((a,b)=>(Date.parse(b.first_seen_at)||0)-(Date.parse(a.first_seen_at)||0)||(a.title||'').localeCompare(b.title||'','ja')||(a.url||'').localeCompare(b.url||''));
 if(sort==='site')filtered.sort((a,b)=>(a.site||'').localeCompare(b.site||'','ja'));
 if(sort==='ending')filtered.sort((a,b)=>(Date.parse(a.ends_at)||Infinity)-(Date.parse(b.ends_at)||Infinity));
 document.getElementById('status').textContent=`表示 ${filtered.length}件 / このタブ ${tabItems.length}件 · 最終更新 ${updated}`;
 const messages=[];
 if(tabItems.some(i=>!i.first_seen_at))messages.push('取得日時がない商品があります。新しいscan.pyで巡回すると記録が始まります。');
 if(errors.length)messages.push(`今回取得できなかった販売店：${errors.join('、')}。前回の商品は「状況未確認」で表示します。`);
 if(allItems.some(i=>!i.availability))messages.push('販売状況が未取得の商品があります。新しいscan.pyで巡回後、再読み込みしてください。');
 if(allItems.length&&allItems.every(i=>!i.price_status))messages.push('価格データがまだありません。価格対応版のscan.pyで巡回してください。');
 document.getElementById('warning').textContent=messages.join(' ');
 const container=document.getElementById('items');container.replaceChildren();
 if(!filtered.length){showEmpty('この条件に該当する標本はありません。状況を「すべて」にするか、販売店・検索条件を変更してください。');return;}
 const fragment=document.createDocumentFragment();
 filtered.forEach(item=>{
  const card=document.createElement('article');card.className='item';const productUrl=safeUrl(item.url),imageUrl=safeUrl(item.image);
  if(imageUrl||isAuction(item)){
   const thumb=productUrl?makeLink(productUrl):document.createElement('div');thumb.className='thumbnail';
   const placeholder=()=>{thumb.classList.add('no-image');const text=document.createElement('span');text.textContent='画像なし';thumb.prepend(text);};
   if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt=item.title||'鉱物標本';img.loading='lazy';img.decoding='async';img.addEventListener('error',()=>{img.remove();placeholder();},{once:true});thumb.appendChild(img);}else placeholder();
   if(isAuction(item)){
    const overlay=document.createElement('span');overlay.className='end-overlay';
    const ending=dateJST(item.ends_at);const elapsed=Number.isFinite(Date.parse(item.ends_at))&&Date.parse(item.ends_at)<=Date.now();
    overlay.textContent=ending?(elapsed?'終了予定を経過 · ':'終了予定 ')+ending:'終了時刻未確認';
    if(elapsed)overlay.classList.add('elapsed');
    if(item.stale)overlay.textContent+='（前回の情報）';
    thumb.appendChild(overlay);
   }
   card.appendChild(thumb);
  }
  const details=document.createElement('div');details.className='details';const site=document.createElement('div');site.className='site';site.textContent=item.site||'販売情報';
  const availability=stateOf(item),badge=document.createElement('span');badge.className=`badge ${availability}`;badge.textContent=item.stale?'状況未確認・前回のデータ':(isAuction(item)?auctionLabels:labels)[availability];
  const title=document.createElement('h2');title.textContent=item.title||'名称不明';details.append(site,badge,title);appendPrice(details,item);
  if(isAuction(item)){
   const meta=document.createElement('p');meta.className='auction-meta';
   const lines=[];if(item.hot_categories?.length)lines.push('Hot Auction items · '+item.hot_categories.join(' / '));
   if(Number.isInteger(item.bid_count))lines.push(`入札 ${item.bid_count}件（取得時点）`);
   lines.push(item.ends_at?'終了予定 '+dateJST(item.ends_at):'終了時刻は出品ページで確認');
   meta.textContent=lines.join(' · ');details.appendChild(meta);
  }
  if(productUrl){const link=makeLink(productUrl);link.className='product-link';link.textContent=isAuction(item)?'出品ページを開く ↗':'販売ページを開く ↗';details.appendChild(link);}
  card.appendChild(details);fragment.appendChild(card);
 });container.appendChild(fragment);
}
document.getElementById('search').addEventListener('input',render);
['shop','availability','sort'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('refresh').addEventListener('click',loadItems);
document.getElementById('retail-tab').addEventListener('click',()=>switchTab('retail'));
document.getElementById('auction-tab').addEventListener('click',()=>switchTab('auction'));
// 保存された終了予定を過ぎたカードの表示を更新。新たな巡回は行わない。
setInterval(()=>{if(loaded&&activeTab==='auction')render();},60000);
loadItems();
</script>
</body>
</html>
